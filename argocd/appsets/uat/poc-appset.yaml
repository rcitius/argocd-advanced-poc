apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd-poc
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: scanmarqed-test
            namespace: poc-test
            chartVersion: "1.0.3"
            logLevel: warn
            replicaCount: "3"
            envVars:
              API_URL:
                value: "https://uat.internal.example.com"
              MAX_WORKERS:
                value: "16"
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: argocd-poc-secret
                    key: db-password
  template:
    metadata:
      name: 'argocd-poc-{{ .env }}'
    spec:
      project: default
      source:
        repoURL: scanmarqedcloud.azurecr.io/helm
        chart: argocd-poc
        targetRevision: '{{ .chartVersion }}'
        helm:
          releaseName: 'argocd-poc-{{ .env }}'
          values: |
            logLevel: {{ .logLevel }}
            replicaCount: {{ .replicaCount }}
            envVars:
              {{- toYaml .envVars | nindent 2 }}
      destination:
        name: in-cluster
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true