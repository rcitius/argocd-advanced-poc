replicaCount: 1

image:
  repository: nginx
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

logLevel: info

# Common to every environment. Elements in the ApplicationSet
# add to these, or override individual keys.
envVars:
  APP_NAME:
    value: "argocd-poc"

nodeSelector:
  workload-type: userpool1

tolerations:
  - key: workload
    operator: Equal
    value: userpool1
    effect: NoSchedule

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi